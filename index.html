<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. НАЗВАНИЕ САЙТА (видно на вкладке браузера) -->
    <title>Мой сайт</title>
    
    <!-- 2. CSS СТИЛИ (здесь задаётся чёрный фон) -->
    <style>
        /* Стиль для всего тела страницы */
        body {
            background-color: #121212; /* Чёрный фон (мягкий чёрный, приятнее для глаз, чем #000000) */
            color: #ffffff;            /* Белый цвет текста, чтобы его было видно на фоне */
            font-family: Arial, sans-serif; /* Красивый и читаемый шрифт */
            margin: 0;                 /* Убираем стандартные отступы браузера */
            padding: 40px;             /* Внутренний отступ от краёв экрана */
        }

        /* Стиль для заголовков */
        h1 {
            color: #ffffff;
        }

        /* Стиль для ссылок (чтобы они не были тёмными и несливались с фоном) */
        a {
            color: #4da6ff; /* Светло-голубой цвет */
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline; /* Подчёркивание при наведении */
        }
    </style>
</head>
<body>

    <!-- 3. СОДЕРЖИМОЕ САЙТА (то, что видит пользователь на странице) -->
    <h1>Добро пожаловать на мой сайт!</h1>
    <p>Теперь у этой страницы чёрный фон и белый текст.</p>
    <p>Это базовый шаблон, который вы можете дополнять.</p>
    
    <a href="https://github.com/raider23rus">Мой GitHub</a>

</body>
</html>
