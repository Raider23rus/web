<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        /* Основные стили для всей страницы */
        body {
            background-color: #121212; /* Мягкий чёрный цвет */
            color: #e0e0e0; /* Светло-серый текст (приятнее для глаз, чем чисто белый) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        /* Стиль для заголовков */
        h1, h2, h3 {
            color: #ffffff;
        }

        /* Стиль для ссылок, чтобы они были видны на тёмном фоне */
        a {
            color: #4dabf7; /* Светло-голубой цвет */
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать на мой сайт!</h1>
    <p>Теперь у этого сайта современный тёмный фон.</p>
    <a href="#">Пример ссылки</a>
</body>
</html>
